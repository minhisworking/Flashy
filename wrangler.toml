name = "flashy-backend"
main = "worker.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "DB"
id = "8783881b9eba446b8511897c7d3f6538"



[triggers]
crons = ["* * * * *"] 
# Giải thích: Chạy mỗi 1 phút. 
# Nếu muốn chạy mỗi giờ: "0 * * * *"
# Nếu muốn chạy mỗi 1 phút (để test): "* * * * *"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

